# v* 태그를 올리면 macOS 러너에서 빌드해 DMG 를 GitHub Release 에 붙인다.
#   git tag v0.2.0 && git push origin v0.2.0
# 애드혹 서명이라 사용자는 처음 열 때 "그래도 열기" 가 필요하다. 공증하려면 Secrets 에 인증서를 넣고
# make-dmg.sh 의 NOTARIZE 절차를 켠다.
name: Release DMG

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: |
          chmod +x build.sh make-dmg.sh
          VERSION="${GITHUB_REF_NAME#v}" ./make-dmg.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Sokki-*.dmg
          generate_release_notes: true
